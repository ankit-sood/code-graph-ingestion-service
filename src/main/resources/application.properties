spring.application.name=code-graph-ingestion-service

# TODO: Add the postgres creds here
spring.datasource.url=jdbc:h2:mem:codegraph;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always

graph-ingestion.workspace.root=/workspace
graph-ingestion.git.command=git
graph-ingestion.git.operation-timeout=60s
graph-ingestion.codegraph.node-command=node
graph-ingestion.codegraph.startup-command=codegraph-daemon
graph-ingestion.codegraph.startup-timeout=60s
graph-ingestion.codegraph.build-timeout=30m
graph-ingestion.codegraph.shutdown-grace-period=10s
graph-ingestion.storage.provider=local
graph-ingestion.storage.max-attempts=3
graph-ingestion.storage.initial-backoff=500ms
graph-ingestion.storage.max-backoff=3s
graph-ingestion.storage.local.root=/workspace/blob-storage
graph-ingestion.storage.azure.account-url=
graph-ingestion.storage.azure.container=codegraph-artifacts
graph-ingestion.storage.azure.path-prefix=graph-ingestion
graph-ingestion.retention.versions=5
graph-ingestion.build.max-concurrent-builds=2
