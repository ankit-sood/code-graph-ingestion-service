spring.datasource.url=jdbc:h2:mem:codegraph;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.open-in-view=false
graph-ingestion.workspace.root=target/test-workspace
graph-ingestion.git.command=git
graph-ingestion.git.operation-timeout=60s

graph-ingestion.codegraph.node-command=/bin/sh
graph-ingestion.codegraph.startup-command=${user.dir}/src/test/resources/codegraph-success.sh
graph-ingestion.codegraph.build-timeout=30s
graph-ingestion.codegraph.shutdown-grace-period=1s
graph-ingestion.storage.provider=local
graph-ingestion.storage.local.root=target/test-blob-storage
graph-ingestion.storage.max-attempts=2
graph-ingestion.storage.initial-backoff=100ms
graph-ingestion.storage.max-backoff=500ms
